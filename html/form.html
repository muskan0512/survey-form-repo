<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
    <main>
        <form>
              
            
           <div class="child">
            <h2>Survey form</h2>
             <label for="fname">First Name:</label><br>
             <input type="text" id="fname" name="fname" value=""><br>

            <label for="mail">Email:</label><br>
            <input type="text" id="address" name="address" value=""><br>

            <label for="age">Age:</label><br>
            <input type="text" id="age" name="age" value=""><br><br>

            <label for="click">Which option best describe you?</label><br>

            <select id="click" name="click">
            <option value="inten">Intern</option>
            <option value="part">part-time</option>
            <option value="full" >full-time</option>
            <option value="remote">remote</option>
            </select>
<BR><BR>
             <label>Would you recommend Techlearns to a friend?</label><BR>
            <label for="yes">
                <input type="radio" id="yes" name="r-yes">Yes
            </label> <BR>
            <label for="no">
                <input type="radio" id="no" name="r-no">No
            </label>
            <BR><BR>

            <label>Courses we offered
                
            </label><br>
            <label for="full-stack">
                <input type="checkbox" name="stack">full-stack
            </label><br>
            <label for="ai">
                <input type="checkbox" name="ai">AI/ML
            </label><br>
            <label for="tally">
                <input type="checkbox" name="tally">tally
            </label><br>
            <label for="c">
                <input type="checkbox" name="C">C/ C++
            </label><br>
            <label for="PYTHON">
                <input type="checkbox" name="PYTHON">Python
            </label>
             <br>

             <label for="comment">Any comments or suggestions</label>
            <textarea name="comment" id="comment" placeholder="Enter your comment here"></textarea>
         <br>
            
             <div class="submit">
                <button class="sub">Submit</button>
                <button class="sub">reset</button>
             </div>
            
           </div>
        </form>
    </main>
</body>
</html>
